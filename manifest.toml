#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "digiquiz"
name = "Digiquiz"
description.en = "Publishing content created with H5P"
description.fr = "Publier des contenus créés avec H5P"

version = "1.4.10~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "AGPL-3.0-only"
website = "https://ladigitale.dev/"
demo = "https://ladigitale.dev/digiquiz/#/"
admindoc = "https://codeberg.org/ladigitale/digiquiz#readme"
userdoc = "https://ladigitale.dev/blog/digiquiz-pour-lire-et-partager-des-contenus-h5p-en-ligne"
code = "https://codeberg.org/ladigitale/digiquiz"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/digiquiz"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.max_upload_size]
      ask.fr = "Taille limite pour le téléchargement des fichiers en Mo"
      ask.en = "Size limit file upload (Mb)"
      type = "number"
      min = 0
      max = 5000
      help.fr = "Valeur maximale de 5Go"
      help.en = "Max size 5Gb"
      default = 200

[resources]
    [resources.sources.main]
    url = "https://codeberg.org/ladigitale/digiquiz/archive/1.4.10.tar.gz"
    sha256 = "c255f760f2039149d95ac277c1f1f00c39d2e5ca6dd731ac8b17acf53416be93"
    autoupdate.strategy = "latest_forgejo_release"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.5-fpm"

    [resources.nodejs]
    version = "24"
